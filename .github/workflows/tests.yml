name: Tests

# The real gate: full type-check plus the entire test suite on every push
# to main and every pull request. Without this, dependency-bump PRs pass
# CI while nothing has actually exercised the code they changed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-actor-smoke:
    name: Release actor lookup smoke check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the selected workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the release guard runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check this run attempt with its workflow token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-actor-state.mjs

  test:
    # Node 20 keeps proving the SDK's own compatibility floor. Node 22 additionally
    # runs the two checks that need the mcp-use devDependency loaded, which declares
    # engines.node >=22.22.2: the compile-time McpMiddlewareFnFor assertion and the
    # real mcp-use server integration test. Those two skip on the Node 20 leg and
    # print why. Unit tests run on both legs. `engines` is unchanged at >=18.0.0.
    name: type-check and test suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      # Strict ci install, no `|| npm install` fallback: a lockfile that
      # can't be installed cleanly should fail loudly, not silently
      # resolve to different versions than the ones under review.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test suite
        run: npm test

      - name: Interop tests
        run: npm run test:interop
